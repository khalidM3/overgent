name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        go: ["1.26.x", "1.27.x"]
    # The shipped local service is intentionally macOS-only today, and its
    # configuration boundary fails closed on other platforms. Exercise both Go
    # versions on the supported OS instead of turning those tests into skips.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "${{ matrix.go }}", cache: true }
      - run: go test -race ./...
      - run: go vet ./...
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm protocol:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
