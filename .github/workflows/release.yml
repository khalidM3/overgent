name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      windows_signing:
        description: Sign Windows executables (credentials and signer anchor are required)
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  # The function bundle every desktop build embeds, generated once and shared
  # rather than per platform. It is a Convex deploy payload with nothing
  # machine-specific in it, and three independently generated copies could
  # disagree on bundleRevision - the number the app and the backend compare to
  # decide whether they are the same build.
  payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.26.x", cache: true }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Generate and verify the bundled backend deploy payload
        run: |
          set -euo pipefail
          node scripts/fetch-backend.mjs
          BACKEND="apps/desktop/build/backend/convex-local-backend"
          WORK="$RUNNER_TEMP/backend-payload"
          mkdir -p "$WORK"
          INSTANCE="overgent-release-$(openssl rand -hex 4)"
          SECRET="$(openssl rand -hex 32)"
          ADMIN_KEY="$("$BACKEND" keygen admin-key --instance-name "$INSTANCE" --instance-secret "$SECRET")"
          "$BACKEND" --interface 127.0.0.1 --port 3210 --site-proxy-port 3211             --convex-origin http://127.0.0.1:3210 --convex-site http://127.0.0.1:3211             --instance-name "$INSTANCE" --instance-secret "$SECRET"             --local-storage "$WORK/storage" --disable-beacon "$WORK/build.sqlite3"             > "$WORK/backend.log" 2>&1 &
          BACKEND_PID=$!
          trap 'kill "$BACKEND_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3210/version >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          scripts/backend-push.sh build http://127.0.0.1:3210 "$ADMIN_KEY" "$WORK"
          cp "$WORK/backend-push.json" apps/desktop/build/backend-push.json
          kill "$BACKEND_PID"
          wait "$BACKEND_PID" 2>/dev/null || true
          trap - EXIT
          go run ./cmd/overgent backend verify --binary "$BACKEND" --bundle apps/desktop/build/backend-push.json
      - uses: actions/upload-artifact@v4
        with:
          name: backend-push
          path: apps/desktop/build/backend-push.json
          if-no-files-found: error

  # The Linux and Windows desktop applications. Neither can be built on the
  # release runner: the Linux one needs CGO against the system WebKitGTK, and
  # the packaging script reads process.platform to choose a layout, so each
  # platform builds its own.
  #
  # These jobs stage a tree and stop. Archiving, signing and checksums happen in
  # the release job, which is the only job holding credentials, so nothing but
  # an unsigned staged tree ever crosses a job boundary.
  desktop-stage:
    needs: payload
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux, staged: overgent }
          - { os: windows-latest, platform: windows, staged: Overgent }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.26.x", cache: true }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # build-desktop.mjs adds the gtk3 build tag itself on Linux; these are the
      # headers that tag then links against.
      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: actions/download-artifact@v4
        with: { name: backend-push, path: apps/desktop/build }
      - name: Fetch this platform's bundled backend
        run: node scripts/fetch-backend.mjs
      - name: Build the desktop application
        env:
          OVERGENT_VERSION: "${{ github.ref_name }}"
          OVERGENT_COMMIT: "${{ github.sha }}"
          OVERGENT_UPDATE_PUBLIC_KEY: "${{ vars.OVERGENT_UPDATE_PUBLIC_KEY }}"
          OVERGENT_BUILD_NUMBER: "${{ github.run_number }}"
        run: pnpm desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: apps/desktop/build/bin/${{ matrix.staged }}
          if-no-files-found: error

  release:
    needs: [payload, desktop-stage]
    runs-on: macos-14
    environment: production-release
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version: "1.26.x", cache: true }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Require distribution legal files
        run: test -f LICENSE && test -f NOTICE
      - name: Require release trust inputs
        env:
          UPDATE_PUBLIC_KEY: "${{ vars.OVERGENT_UPDATE_PUBLIC_KEY }}"
          UPDATE_PRIVATE_KEY: "${{ secrets.OVERGENT_UPDATE_SIGNING_PRIVATE_KEY }}"
          APPLE_TEAM_ID: "${{ vars.APPLE_TEAM_ID }}"
          APPLE_DEVELOPER_NAME: "${{ vars.APPLE_DEVELOPER_NAME }}"
          CERTIFICATE: "${{ secrets.MACOS_CERTIFICATE_P12 }}"
          CERTIFICATE_PASSWORD: "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}"
          APPLE_ID: "${{ secrets.APPLE_ID }}"
          APPLE_APP_PASSWORD: "${{ secrets.APPLE_APP_PASSWORD }}"
          BLOB_READ_WRITE_TOKEN: "${{ secrets.BLOB_READ_WRITE_TOKEN }}"
          RELEASE_BLOB_ORIGIN: "${{ vars.OVERGENT_RELEASE_BLOB_ORIGIN }}"
          WINDOWS_SIGNING_REQUESTED: "${{ inputs.windows_signing || vars.WINDOWS_SIGNING_REQUIRED == 'true' }}"
          WINDOWS_CERTIFICATE: "${{ secrets.WINDOWS_CERTIFICATE_PFX }}"
          WINDOWS_CERTIFICATE_PASSWORD: "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}"
          WINDOWS_SIGNER_CERT_SHA256: "${{ vars.WINDOWS_SIGNER_CERT_SHA256 }}"
        run: |
          test -n "$UPDATE_PUBLIC_KEY"
          test -n "$UPDATE_PRIVATE_KEY"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_DEVELOPER_NAME"
          test -n "$CERTIFICATE"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_PASSWORD"
          test -n "$BLOB_READ_WRITE_TOKEN"
          test -n "$RELEASE_BLOB_ORIGIN"
          if [ "$WINDOWS_SIGNING_REQUESTED" = true ]; then
            test -n "$WINDOWS_CERTIFICATE" || { echo "Windows signing was requested but WINDOWS_CERTIFICATE_PFX is absent" >&2; exit 1; }
            test -n "$WINDOWS_CERTIFICATE_PASSWORD" || { echo "Windows signing was requested but WINDOWS_CERTIFICATE_PASSWORD is absent" >&2; exit 1; }
            test -n "$WINDOWS_SIGNER_CERT_SHA256" || { echo "Windows signing was requested but WINDOWS_SIGNER_CERT_SHA256 is absent" >&2; exit 1; }
          fi
      - name: Import Apple signing identity
        env:
          CERTIFICATE: "${{ secrets.MACOS_CERTIFICATE_P12 }}"
          CERTIFICATE_PASSWORD: "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}"
        run: |
          KEYCHAIN="$RUNNER_TEMP/overgent-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
      - uses: anchore/sbom-action/download-syft@v0
      # The bundled backend ships inside the app, and its deploy payload is
      # generated from *this* tag's Convex functions rather than committed, so
      # the deployed bundle is always the code the release was cut from.
      #
      # The verify step is a release gate: the deploy2 endpoints it replays
      # are internal Convex detail, so a backend or CLI bump can change their
      # shape with no announcement. Replaying the fresh payload against a fresh
      # backend here means a broken pin fails the release instead of reaching a
      # member as an app that starts and then coordinates nothing.
      - uses: actions/download-artifact@v4
        with: { name: backend-push, path: apps/desktop/build }
      # Outside the working copy on purpose: goreleaser refuses to release from
      # a dirty tree, and an untracked directory in the repository root is
      # exactly that.
      - uses: actions/download-artifact@v4
        with: { name: desktop-linux, path: "${{ runner.temp }}/staged-desktop/linux" }
      - uses: actions/download-artifact@v4
        with: { name: desktop-windows, path: "${{ runner.temp }}/staged-desktop/windows" }
      - name: Take the shared backend payload and this runner's backend
        run: |
          set -euo pipefail
          node scripts/fetch-backend.mjs
          go run ./cmd/overgent backend verify \
            --binary apps/desktop/build/backend/convex-local-backend \
            --bundle apps/desktop/build/backend-push.json
      - name: Build, sign, and notarize macOS desktop beta
        env:
          OVERGENT_VERSION: "${{ github.ref_name }}"
          OVERGENT_COMMIT: "${{ github.sha }}"
          OVERGENT_UPDATE_PUBLIC_KEY: "${{ vars.OVERGENT_UPDATE_PUBLIC_KEY }}"
          OVERGENT_CODESIGN_IDENTITY: "Developer ID Application: ${{ vars.APPLE_DEVELOPER_NAME }} (${{ vars.APPLE_TEAM_ID }})"
          OVERGENT_BUILD_NUMBER: "${{ github.run_number }}"
          APPLE_ID: "${{ secrets.APPLE_ID }}"
          APPLE_APP_PASSWORD: "${{ secrets.APPLE_APP_PASSWORD }}"
          APPLE_TEAM_ID: "${{ vars.APPLE_TEAM_ID }}"
        run: |
          OVERGENT_BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          export OVERGENT_BUILD_TIME
          pnpm desktop:build
          ditto -c -k --keepParent apps/desktop/build/bin/Overgent.app "$RUNNER_TEMP/Overgent-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Overgent-notarize.zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple apps/desktop/build/bin/Overgent.app
          xcrun stapler validate apps/desktop/build/bin/Overgent.app
          mkdir -p dist-desktop
          # No version in the name on purpose: overgent.com/download/macos
          # resolves through /releases/latest/download/<exact name>, which
          # accepts no wildcard, so a versioned name could never be linked to.
          # The release tag carries the version.
          ditto -c -k --keepParent apps/desktop/build/bin/Overgent.app "dist-desktop/Overgent_macOS_arm64.zip"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          OVERGENT_UPDATE_PUBLIC_KEY: "${{ vars.OVERGENT_UPDATE_PUBLIC_KEY }}"
          OVERGENT_CODESIGN_IDENTITY: "Developer ID Application: ${{ vars.APPLE_DEVELOPER_NAME }} (${{ vars.APPLE_TEAM_ID }})"
      - name: Package fetch-on-demand local backends and optional Windows signatures
        env:
          WINDOWS_SIGNING_REQUESTED: "${{ inputs.windows_signing || vars.WINDOWS_SIGNING_REQUIRED == 'true' }}"
          WINDOWS_CERTIFICATE: "${{ secrets.WINDOWS_CERTIFICATE_PFX }}"
          WINDOWS_CERTIFICATE_PASSWORD: "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}"
          WINDOWS_SIGNER_CERT_SHA256: "${{ vars.WINDOWS_SIGNER_CERT_SHA256 }}"
          OVERGENT_CODESIGN_IDENTITY: "Developer ID Application: ${{ vars.APPLE_DEVELOPER_NAME }} (${{ vars.APPLE_TEAM_ID }})"
        run: |
          set -euo pipefail
          mkdir -p dist-backend "$RUNNER_TEMP/backend-targets"
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            node scripts/fetch-backend.mjs --platform "$target" --out "$RUNNER_TEMP/backend-targets/$target"
            cp apps/desktop/build/backend-push.json "$RUNNER_TEMP/backend-targets/$target/backend-push.json"
          done

          codesign --force --options runtime --timestamp --sign "$OVERGENT_CODESIGN_IDENTITY" "$RUNNER_TEMP/backend-targets/darwin-arm64/convex-local-backend"
          codesign --force --options runtime --timestamp --sign "$OVERGENT_CODESIGN_IDENTITY" "$RUNNER_TEMP/backend-targets/darwin-x64/convex-local-backend"

          WIN_CLI="$(find dist -type f -name overgent.exe -print -quit)"
          test -n "$WIN_CLI"
          if [ "$WINDOWS_SIGNING_REQUESTED" = true ]; then
            printf '%s' "$WINDOWS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/windows-signing.pfx"
            WIN_CERT_PASS="$WINDOWS_CERTIFICATE_PASSWORD" openssl pkcs12 -in "$RUNNER_TEMP/windows-signing.pfx" -clcerts -nokeys -passin env:WIN_CERT_PASS -out "$RUNNER_TEMP/windows-signing.pem"
            OBSERVED_CERT_SHA="$(openssl x509 -in "$RUNNER_TEMP/windows-signing.pem" -outform DER | shasum -a 256 | awk '{print $1}')"
            test "$OBSERVED_CERT_SHA" = "$(printf '%s' "$WINDOWS_SIGNER_CERT_SHA256" | tr '[:upper:]' '[:lower:]')" || {
              echo "WINDOWS_SIGNER_CERT_SHA256 does not match WINDOWS_CERTIFICATE_PFX" >&2; exit 1;
            }
            brew install osslsigncode
            sign_windows() {
              input="$1"
              output="$input.signed"
              osslsigncode sign -pkcs12 "$RUNNER_TEMP/windows-signing.pfx" -pass "$WINDOWS_CERTIFICATE_PASSWORD" \
                -n Overgent -i https://overgent.com -h sha256 -ts http://timestamp.digicert.com \
                -in "$input" -out "$output"
              mv "$output" "$input"
              osslsigncode verify -CAfile "$RUNNER_TEMP/windows-signing.pem" "$input"
            }
            sign_windows "$WIN_CLI"
            sign_windows "$RUNNER_TEMP/backend-targets/win32-x64/convex-local-backend.exe"
            # The Windows desktop tree was staged on its own runner and crossed
            # the job boundary unsigned, because this is the only job holding
            # the certificate. Every executable in it is signed, not just the
            # shell: the CLI and the backend beside it are what it runs.
            sign_windows "$RUNNER_TEMP/staged-desktop/windows/overgent-desktop.exe"
            sign_windows "$RUNNER_TEMP/staged-desktop/windows/resources/overgent.exe"
            sign_windows "$RUNNER_TEMP/staged-desktop/windows/resources/backend/convex-local-backend.exe"
          else
            echo "Windows artifacts are unsigned portability builds; install.ps1 will refuse them unless the member explicitly selects local-only development mode."
          fi

          # Archive the staged Linux and Windows desktop trees. A GitHub
          # artifact does not carry the executable bit, so it has to be put
          # back before the tar is written or nothing in it can be started.
          chmod 755 \
            "$RUNNER_TEMP/staged-desktop/linux/overgent-desktop" \
            "$RUNNER_TEMP/staged-desktop/linux/resources/overgent" \
            "$RUNNER_TEMP/staged-desktop/linux/resources/backend/convex-local-backend"
          mv "$RUNNER_TEMP/staged-desktop/linux" "$RUNNER_TEMP/Overgent"
          COPYFILE_DISABLE=1 tar --no-xattrs -czf "$GITHUB_WORKSPACE/dist-desktop/Overgent_linux_amd64.tar.gz" -C "$RUNNER_TEMP" Overgent
          rm -rf "$RUNNER_TEMP/Overgent"
          mv "$RUNNER_TEMP/staged-desktop/windows" "$RUNNER_TEMP/Overgent"
          (cd "$RUNNER_TEMP" && zip -X -q -r "$GITHUB_WORKSPACE/dist-desktop/Overgent_windows_amd64.zip" Overgent)
          rm -rf "$RUNNER_TEMP/Overgent"

          WIN_ARCHIVE="$(find dist -maxdepth 1 -type f -name 'overgent_*_windows_amd64.zip' -print -quit)"
          test -n "$WIN_ARCHIVE"
          WIN_ARCHIVE="$GITHUB_WORKSPACE/$WIN_ARCHIVE"
          WIN_STAGE="$RUNNER_TEMP/windows-cli-archive"
          mkdir -p "$WIN_STAGE"
          cp "$WIN_CLI" "$WIN_STAGE/overgent.exe"
          cp LICENSE NOTICE README.md "$WIN_STAGE/"
          rm -f "$WIN_ARCHIVE"
          (cd "$WIN_STAGE" && zip -X -q "$WIN_ARCHIVE" overgent.exe LICENSE NOTICE README.md)

          package_tar() {
            source="$1"
            os="$2"
            arch="$3"
            COPYFILE_DISABLE=1 tar --no-xattrs -czf "dist-backend/overgent_backend_${GITHUB_REF_NAME}_${os}_${arch}.tar.gz" \
              -C "$source" convex-local-backend backend-push.json LICENSE.md
          }
          package_tar "$RUNNER_TEMP/backend-targets/darwin-arm64" darwin arm64
          package_tar "$RUNNER_TEMP/backend-targets/darwin-x64" darwin amd64
          package_tar "$RUNNER_TEMP/backend-targets/linux-x64" linux amd64
          package_tar "$RUNNER_TEMP/backend-targets/linux-arm64" linux arm64
          (cd "$RUNNER_TEMP/backend-targets/win32-x64" && zip -X -q \
            "$GITHUB_WORKSPACE/dist-backend/overgent_backend_${GITHUB_REF_NAME}_windows_amd64.zip" \
            convex-local-backend.exe backend-push.json LICENSE.md)

          find dist -maxdepth 1 -type f \( -name 'overgent_*.tar.gz' -o -name 'overgent_*.zip' \) -print0 | LC_ALL=C sort -z | xargs -0 shasum -a 256 > dist/checksums.txt
          find dist-backend -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 | LC_ALL=C sort -z | xargs -0 shasum -a 256 > dist-backend/checksums.txt
      - name: Create signed updater metadata
        env:
          UPDATE_PRIVATE_KEY: "${{ secrets.OVERGENT_UPDATE_SIGNING_PRIVATE_KEY }}"
        run: |
          printf '%s' "$UPDATE_PRIVATE_KEY" > "$RUNNER_TEMP/update-signing-key"
          OVERGENT_UPDATE_SIGNING_KEY_FILE="$RUNNER_TEMP/update-signing-key" go run ./cmd/release-metadata \
            -dist dist \
            -version "${GITHUB_REF_NAME}" \
            -base-url "https://github.com/khalidM3/overgent/releases/download/${GITHUB_REF_NAME}" \
            -output dist/update-manifest.json
          OVERGENT_UPDATE_SIGNING_KEY_FILE="$RUNNER_TEMP/update-signing-key" go run ./cmd/release-metadata \
            -dist dist-backend \
            -version "${GITHUB_REF_NAME}" \
            -base-url "https://github.com/khalidM3/overgent/releases/download/${GITHUB_REF_NAME}" \
            -output dist-backend/backend-manifest.json
      - name: Render release installer
        run: |
          sed -e "s|__OVERGENT_UPDATE_PUBLIC_KEY__|$UPDATE_PUBLIC_KEY|g" -e "s|__OVERGENT_APPLE_TEAM_ID__|$APPLE_TEAM_ID|g" install/install.sh > dist/install.sh
          cp install/uninstall.sh dist/uninstall.sh
          WINDOWS_ANCHOR="${WINDOWS_SIGNER_CERT_SHA256:-__OVERGENT_WINDOWS_SIGNER_CERT_SHA256__}"
          sed -e "s|__OVERGENT_WINDOWS_SIGNER_CERT_SHA256__|$WINDOWS_ANCHOR|g" \
            -e "s|__OVERGENT_UPDATE_PUBLIC_KEY__|$UPDATE_PUBLIC_KEY|g" install/install.ps1 > dist/install.ps1
          cp install/uninstall.ps1 dist/uninstall.ps1
          chmod 755 dist/install.sh dist/uninstall.sh
          find dist-desktop -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 | LC_ALL=C sort -z | xargs -0 shasum -a 256 > dist/desktop-checksums.txt
          # dist-backend/checksums.txt and dist/checksums.txt are different
          # files with the same basename, and a release asset is addressed by
          # name: uploading both meant one silently replaced the other, and
          # clobbering an asset another upload in the same batch had just
          # replaced is what produced "HTTP 404" on an asset id. The backend
          # one gets its own name.
          mv dist-backend/checksums.txt dist-backend/backend-checksums.txt

          # One file per call. gh uploads a batch concurrently, so a single
          # failure takes the whole batch with it and says nothing about which
          # file it was; serially, the log names the file that failed.
          for asset in \
            dist/update-manifest.json dist/checksums.txt \
            dist/install.sh dist/uninstall.sh dist/install.ps1 dist/uninstall.ps1 \
            dist/overgent_*.tar.gz dist/overgent_*.zip \
            dist-backend/backend-manifest.json dist-backend/backend-checksums.txt dist-backend/overgent_backend_* \
            dist/desktop-checksums.txt dist-desktop/Overgent_*
          do
            echo "uploading $asset"
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          done
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          UPDATE_PUBLIC_KEY: "${{ vars.OVERGENT_UPDATE_PUBLIC_KEY }}"
          APPLE_TEAM_ID: "${{ vars.APPLE_TEAM_ID }}"
          WINDOWS_SIGNER_CERT_SHA256: "${{ vars.WINDOWS_SIGNER_CERT_SHA256 }}"
      - uses: sigstore/cosign-installer@v3
      - name: Sign public release metadata with Sigstore
        run: |
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
          cosign sign-blob --yes --bundle dist/update-manifest.json.sigstore.json dist/update-manifest.json
          cosign sign-blob --yes --bundle dist-backend/backend-manifest.json.sigstore.json dist-backend/backend-manifest.json
          cosign sign-blob --yes --bundle dist/desktop-checksums.txt.sigstore.json dist/desktop-checksums.txt
          gh release upload "$GITHUB_REF_NAME" dist/checksums.txt.sigstore.json dist/update-manifest.json.sigstore.json dist-backend/backend-manifest.json.sigstore.json dist/desktop-checksums.txt.sigstore.json --clobber
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
