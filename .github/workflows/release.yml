name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-14
    environment: production-release
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version: "1.26.x", cache: true }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Require distribution legal files
        run: test -f LICENSE && test -f NOTICE
      - name: Require release trust inputs
        env:
          UPDATE_PUBLIC_KEY: "${{ vars.OVERGENT_UPDATE_PUBLIC_KEY }}"
          UPDATE_PRIVATE_KEY: "${{ secrets.OVERGENT_UPDATE_SIGNING_PRIVATE_KEY }}"
          APPLE_TEAM_ID: "${{ vars.APPLE_TEAM_ID }}"
          APPLE_DEVELOPER_NAME: "${{ vars.APPLE_DEVELOPER_NAME }}"
          CERTIFICATE: "${{ secrets.MACOS_CERTIFICATE_P12 }}"
          CERTIFICATE_PASSWORD: "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}"
          APPLE_ID: "${{ secrets.APPLE_ID }}"
          APPLE_APP_PASSWORD: "${{ secrets.APPLE_APP_PASSWORD }}"
          BLOB_READ_WRITE_TOKEN: "${{ secrets.BLOB_READ_WRITE_TOKEN }}"
          RELEASE_BLOB_ORIGIN: "${{ vars.OVERGENT_RELEASE_BLOB_ORIGIN }}"
        run: |
          test -n "$UPDATE_PUBLIC_KEY"
          test -n "$UPDATE_PRIVATE_KEY"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_DEVELOPER_NAME"
          test -n "$CERTIFICATE"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_PASSWORD"
          test -n "$BLOB_READ_WRITE_TOKEN"
          test -n "$RELEASE_BLOB_ORIGIN"
      - name: Import Apple signing identity
        env:
          CERTIFICATE: "${{ secrets.MACOS_CERTIFICATE_P12 }}"
          CERTIFICATE_PASSWORD: "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}"
        run: |
          KEYCHAIN="$RUNNER_TEMP/overgent-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
      - uses: anchore/sbom-action/download-syft@v0
      - name: Build, sign, and notarize macOS desktop beta
        env:
          OVERGENT_VERSION: "${{ github.ref_name }}"
          OVERGENT_COMMIT: "${{ github.sha }}"
          OVERGENT_UPDATE_PUBLIC_KEY: "${{ vars.OVERGENT_UPDATE_PUBLIC_KEY }}"
          OVERGENT_CODESIGN_IDENTITY: "Developer ID Application: ${{ vars.APPLE_DEVELOPER_NAME }} (${{ vars.APPLE_TEAM_ID }})"
          OVERGENT_BUILD_NUMBER: "${{ github.run_number }}"
          APPLE_ID: "${{ secrets.APPLE_ID }}"
          APPLE_APP_PASSWORD: "${{ secrets.APPLE_APP_PASSWORD }}"
          APPLE_TEAM_ID: "${{ vars.APPLE_TEAM_ID }}"
        run: |
          export OVERGENT_BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          pnpm desktop:build
          ditto -c -k --keepParent apps/desktop/build/bin/Overgent.app "$RUNNER_TEMP/Overgent-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Overgent-notarize.zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple apps/desktop/build/bin/Overgent.app
          xcrun stapler validate apps/desktop/build/bin/Overgent.app
          mkdir -p dist-desktop
          ditto -c -k --keepParent apps/desktop/build/bin/Overgent.app "dist-desktop/Overgent_${GITHUB_REF_NAME}_macOS_arm64.zip"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          OVERGENT_UPDATE_PUBLIC_KEY: "${{ vars.OVERGENT_UPDATE_PUBLIC_KEY }}"
          OVERGENT_CODESIGN_IDENTITY: "Developer ID Application: ${{ vars.APPLE_DEVELOPER_NAME }} (${{ vars.APPLE_TEAM_ID }})"
      - name: Create signed updater metadata
        env:
          UPDATE_PRIVATE_KEY: "${{ secrets.OVERGENT_UPDATE_SIGNING_PRIVATE_KEY }}"
          RELEASE_BLOB_ORIGIN: "${{ vars.OVERGENT_RELEASE_BLOB_ORIGIN }}"
        run: |
          printf '%s' "$UPDATE_PRIVATE_KEY" > "$RUNNER_TEMP/update-signing-key"
          OVERGENT_UPDATE_SIGNING_KEY_FILE="$RUNNER_TEMP/update-signing-key" go run ./cmd/release-metadata \
            -dist dist \
            -version "${GITHUB_REF_NAME}" \
            -base-url "${RELEASE_BLOB_ORIGIN}/releases/${GITHUB_REF_NAME}" \
            -output dist/update-manifest.json
      - name: Render release installer
        run: |
          sed -e "s|__OVERGENT_UPDATE_PUBLIC_KEY__|$UPDATE_PUBLIC_KEY|g" -e "s|__OVERGENT_APPLE_TEAM_ID__|$APPLE_TEAM_ID|g" install/install.sh > dist/install.sh
          cp install/uninstall.sh dist/uninstall.sh
          chmod 755 dist/install.sh dist/uninstall.sh
          shasum -a 256 dist-desktop/*.zip > dist/desktop-checksums.txt
          gh release upload "$GITHUB_REF_NAME" dist/update-manifest.json dist/install.sh dist/uninstall.sh dist/desktop-checksums.txt dist-desktop/*.zip --clobber
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          UPDATE_PUBLIC_KEY: "${{ vars.OVERGENT_UPDATE_PUBLIC_KEY }}"
          APPLE_TEAM_ID: "${{ vars.APPLE_TEAM_ID }}"
      - uses: sigstore/cosign-installer@v3
      - name: Sign public release metadata with Sigstore
        run: |
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
          cosign sign-blob --yes --bundle dist/update-manifest.json.sigstore.json dist/update-manifest.json
          cosign sign-blob --yes --bundle dist/desktop-checksums.txt.sigstore.json dist/desktop-checksums.txt
          gh release upload "$GITHUB_REF_NAME" dist/checksums.txt.sigstore.json dist/update-manifest.json.sigstore.json dist/desktop-checksums.txt.sigstore.json --clobber
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: Publish public candidate artifacts
        env:
          BLOB_READ_WRITE_TOKEN: "${{ secrets.BLOB_READ_WRITE_TOKEN }}"
          OVERGENT_RELEASE_BLOB_ORIGIN: "${{ vars.OVERGENT_RELEASE_BLOB_ORIGIN }}"
        run: node scripts/publish-release-blobs.mjs candidate "${GITHUB_REF_NAME}"
