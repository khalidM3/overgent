version: 2
project_name: stickguy
builds:
  - id: stickguy
    main: ./cmd/stickguy
    binary: stickguy
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags:
      - >-
        -s -w
        -X main.version={{ .Tag }}
        -X main.commit={{ .FullCommit }}
        -X main.buildTime={{ .Date }}
        -X main.updatePublicKey={{ .Env.STICKGUY_UPDATE_PUBLIC_KEY }}
    hooks:
      post:
        - cmd: ./scripts/sign-darwin-artifact.sh "{{ .Os }}" "{{ .Path }}"
          output: true
archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - NOTICE
      - README.md
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
sboms:
  - artifacts: archive
    documents:
      - "${artifact}.spdx.json"
metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
release:
  draft: true
