version: 2
project_name: stickguy
builds:
  - id: stickguy
    main: ./cmd/stickguy
    binary: stickguy
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
sboms:
  - artifacts: archive
release:
  draft: true
